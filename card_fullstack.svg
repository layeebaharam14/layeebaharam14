<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Indigo / Deep Blue) -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>

    <!-- Animated Border Glow Gradient -->
    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1">
        <animate attributeName="stop-color" values="#6366F1;#818CF8;#38BDF8;#6366F1" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#6366F1;#818CF8;#38BDF8" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8;#38BDF8;#6366F1;#818CF8" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Badge Background Gradient -->
    <linearGradient id="badgeGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>

    <!-- Subtle Mesh Glow -->
    <radialGradient id="meshGlow2" cx="90%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <style>
      .card-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 20px;
        font-weight: 700;
        fill: #FFFFFF;
        letter-spacing: 0.3px;
      }
      .card-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 500;
        fill: #C7D2FE;
      }
      .card-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 12.5px;
        font-weight: 400;
        fill: #E0E7FF;
        line-height: 1.5;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 10px;
        font-weight: 700;
        fill: #EEF2FF;
        letter-spacing: 1px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 11px;
        font-weight: 600;
        fill: #E0E7FF;
      }
    </style>
  </defs>

  <!-- Card Base with Glowing Animated Border -->
  <rect x="2" y="2" width="516" height="276" rx="18" ry="18" fill="url(#bgGrad2)" stroke="url(#borderGrad2)" stroke-width="2"/>

  <!-- Radial Glow Accent in corner -->
  <rect x="2" y="2" width="516" height="276" rx="18" ry="18" fill="url(#meshGlow2)" pointer-events="none"/>

  <!-- Top Category Pill -->
  <g transform="translate(24, 22)">
    <rect x="0" y="0" width="175" height="24" rx="12" fill="url(#pillGrad2)"/>
    <circle cx="12" cy="12" r="4" fill="#38BDF8">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="16" class="pill-text">FULL-STACK CRAFT</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="24" y="80" class="card-title">🌐 Web &amp; API Architecture</text>
  <text x="24" y="103" class="card-subtitle">Full-Stack Engineering • Client-Server Scalability</text>

  <!-- Description paragraph -->
  <text x="24" y="134" class="card-desc">Architecting robust full-stack applications with modular React interfaces</text>
  <text x="24" y="152" class="card-desc">powered by reliable Django &amp; Node.js backend services and structured APIs.</text>

  <!-- Pill Badges at bottom -->
  <g transform="translate(24, 182)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="130" height="28" rx="8" fill="url(#badgeGrad2)" stroke="#4F46E5" stroke-width="1"/>
    <text x="14" y="18" class="badge-text">⚛️ React Frontends</text>

    <!-- Badge 2 -->
    <rect x="140" y="0" width="155" height="28" rx="8" fill="url(#badgeGrad2)" stroke="#4F46E5" stroke-width="1"/>
    <text x="154" y="18" class="badge-text">🟢 Node &amp; Django APIs</text>

    <!-- Badge 3 -->
    <rect x="305" y="0" width="160" height="28" rx="8" fill="url(#badgeGrad2)" stroke="#4F46E5" stroke-width="1"/>
    <text x="319" y="18" class="badge-text">🗄️ Database Design</text>
  </g>

  <!-- Footer Pillar Highlight Bar -->
  <g transform="translate(24, 230)">
    <line x1="0" y1="0" x2="472" y2="0" stroke="#312E81" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="0" y="24" class="card-subtitle" font-size="12px">💙 <tspan fill="#818CF8" font-weight="600">Focus Areas:</tspan> RESTful Architecture • State Flow • High Usability</text>
  </g>
</svg>
