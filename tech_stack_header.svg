<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 854 75" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="techHeaderBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2E1065"/>
      <stop offset="50%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Animated Shimmer Border Gradient -->
    <linearGradient id="techHeaderBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC">
        <animate attributeName="stop-color" values="#C084FC;#F3E8FF;#7C3AED;#C084FC" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#F3E8FF">
        <animate attributeName="stop-color" values="#F3E8FF;#7C3AED;#C084FC;#F3E8FF" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#C084FC;#F3E8FF;#7C3AED" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="techGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#A855F7" flood-opacity="0.4"/>
    </filter>

    <style>
      .header-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 24px;
        font-weight: 800;
        fill: #FFFFFF;
        letter-spacing: 2px;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>

  <!-- Capsule Header Pill (Centered at 427, width 440 -> x = 207) -->
  <rect x="207" y="8" width="440" height="58" rx="29" ry="29" fill="url(#techHeaderBg)" stroke="url(#techHeaderBorder)" stroke-width="2.5" filter="url(#techGlow)"/>

  <!-- Left Star Accent -->
  <circle cx="240" cy="37" r="4" fill="#FDE047">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="254" cy="37" r="2.5" fill="#E9D5FF"/>

  <!-- Main Headline Text -->
  <text x="427" y="37" class="header-text">✦ TECH STACK &amp; TOOLS ✦</text>

  <!-- Right Star Accent -->
  <circle cx="600" cy="37" r="2.5" fill="#E9D5FF"/>
  <circle cx="614" cy="37" r="4" fill="#FDE047">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
