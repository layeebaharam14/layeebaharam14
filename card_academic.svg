<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140726"/>
      <stop offset="50%" stop-color="#2A0F50"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>

    <!-- Animated Border Glow Gradient -->
    <linearGradient id="borderGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#C084FC;#E9D5FF;#7C3AED;#A855F7" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#A855F7;#C084FC;#E9D5FF;#7C3AED" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#C084FC">
        <animate attributeName="stop-color" values="#C084FC;#E9D5FF;#7C3AED;#A855F7;#C084FC" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Badge Background Gradient -->
    <linearGradient id="badgeGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B1366"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>

    <!-- Dynamic Breathing Ambient Aura -->
    <radialGradient id="meshGlow1" cx="88%" cy="12%" r="65%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.45">
        <animate attributeName="stop-opacity" values="0.25;0.55;0.25" dur="3.5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <!-- Light Sweep Shimmer Beam -->
    <linearGradient id="shimmerBeam1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="cardClip1">
      <rect x="2" y="2" width="516" height="276" rx="18" ry="18"/>
    </clipPath>

    <style>
      .card-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 20px;
        font-weight: 700;
        fill: #FFFFFF;
        letter-spacing: 0.3px;
      }
      .card-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 500;
        fill: #D8B4FE;
      }
      .card-desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 12.5px;
        font-weight: 400;
        fill: #E9D5FF;
        line-height: 1.5;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 10px;
        font-weight: 700;
        fill: #F3E8FF;
        letter-spacing: 1px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 11px;
        font-weight: 600;
        fill: #E9D5FF;
      }
      @keyframes floatBadge1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes floatBadge2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes floatBadge3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      .badge-float-1 { animation: floatBadge1 3.2s ease-in-out infinite; }
      .badge-float-2 { animation: floatBadge2 3.2s ease-in-out infinite 0.5s; }
      .badge-float-3 { animation: floatBadge3 3.2s ease-in-out infinite 1s; }
      
      @keyframes lightSweep {
        0% { transform: translateX(-400px) rotate(25deg); }
        100% { transform: translateX(700px) rotate(25deg); }
      }
      .shimmer-bar {
        animation: lightSweep 4.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Card Base with Glowing Animated Border -->
  <rect x="2" y="2" width="516" height="276" rx="18" ry="18" fill="url(#bgGrad1)" stroke="url(#borderGrad1)" stroke-width="2">
    <animate attributeName="stroke-width" values="1.8;2.8;1.8" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Breathing Ambient Aura in top corner -->
  <rect x="2" y="2" width="516" height="276" rx="18" ry="18" fill="url(#meshGlow1)" pointer-events="none"/>

  <!-- Shimmer Light Sweep Beam -->
  <g clip-path="url(#cardClip1)" pointer-events="none">
    <rect class="shimmer-bar" x="-200" y="-120" width="140" height="520" fill="url(#shimmerBeam1)"/>
  </g>

  <!-- Top Category Pill with Radar Ping Beacon -->
  <g transform="translate(24, 22)">
    <rect x="0" y="0" width="180" height="24" rx="12" fill="url(#pillGrad1)"/>
    <circle cx="12" cy="12" r="4" fill="#C084FC"/>
    <circle cx="12" cy="12" r="4" fill="none" stroke="#C084FC" stroke-width="1.5">
      <animate attributeName="r" values="4;10" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="24" y="16" class="pill-text">ACADEMIC &amp; CORE CS</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="24" y="80" class="card-title">🎓 Computer Science Foundations</text>
  <text x="24" y="103" class="card-subtitle">B.E. Computer Science Student • Algorithmic Mindset</text>

  <!-- Description paragraph -->
  <text x="24" y="134" class="card-desc">Building rock-solid engineering foundations through active problem-solving,</text>
  <text x="24" y="152" class="card-desc">mastering core algorithmic efficiency, and object-oriented design patterns.</text>

  <!-- Interactive/Floating Pill Badges at bottom -->
  <g transform="translate(24, 182)">
    <!-- Badge 1 -->
    <g class="badge-float-1">
      <rect x="0" y="0" width="145" height="28" rx="8" fill="url(#badgeGrad1)" stroke="#7C3AED" stroke-width="1"/>
      <text x="14" y="18" class="badge-text">⚡ Data Structures</text>
    </g>

    <!-- Badge 2 -->
    <g class="badge-float-2">
      <rect x="155" y="0" width="135" height="28" rx="8" fill="url(#badgeGrad1)" stroke="#7C3AED" stroke-width="1"/>
      <text x="169" y="18" class="badge-text">🧩 OOP &amp; Design</text>
    </g>

    <!-- Badge 3 -->
    <g class="badge-float-3">
      <rect x="300" y="0" width="168" height="28" rx="8" fill="url(#badgeGrad1)" stroke="#7C3AED" stroke-width="1"/>
      <text x="314" y="18" class="badge-text">🚀 Problem Solving</text>
    </g>
  </g>

  <!-- Footer Pillar Highlight Bar -->
  <g transform="translate(24, 230)">
    <line x1="0" y1="0" x2="472" y2="0" stroke="#4C1D95" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="0" y="24" class="card-subtitle" font-size="12px">💜 <tspan fill="#C084FC" font-weight="600">Focus Areas:</tspan> Algorithmic Complexity • Clean Architecture • Logic</text>
  </g>
</svg>
